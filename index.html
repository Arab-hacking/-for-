    <script>
      const log = console.log.bind();

      // map() -  перебирает элементы массива и возвращает новый массив с этими элементами
      let fruits = ["яблоко", "киви", "банан"];

      let result = fruits.map((elem, index) => {
        return `${index + 1}: ` + elem;
      });
      log(fruits);
      log(result);

      // split и join
      // split() - разбивает строку и возвращает в виде массива
      let str = "Arabov, Arab, Arabovich";
      log(str);
      let resultStr = str.split(",");
      log(resultStr);

      let car = "Mercedes BMW Audi Lada";
      log(car);
      log(car.split(" "));

      // join() - из массива делает строку
      let car1 = ["BMW", "AUDI", "LADA", "Mercedes"];
      log(car1);
      log(car1.join("!"));

      // reverse() - переворачиваетпорядок элементов массива
      let students = ["Араб", "Азиз", "Саид", "Абдулла"];
      log(students);
      log(students.reverse());
      let smartphone = ["Samsung", "OPPO", "realme", "Iphone"];
      log(smartphone);
      log(smartphone.reverse());
      /* sort(fn) - Вызов arr.sort() сортирует массив на месте 
      '(не создаёт копию массива), меняя в нём порядок элементов. */

      let numberStr = ["1", "20", "5", "4", "3"]
      log(numberStr)
      log(numberStr.sort())
      let resnums = numberStr.sort((a , b) => a - b)
      log(resnums)
    </script>
